<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Product</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="card">
    <div class="card-header">
      <h4>Edit Product</h4>
    </div>
    <div class="card-body">
      <form th:action="@{'/admin/products/' + ${product.id}}" th:object="${product}" method="post">
        <input type="hidden" name="_method" value="put"/>

        <div class="mb-3">
          <label>Name</label>
          <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label>Price</label>
          <input type="number" th:field="*{price}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label>Image URL</label>
          <input type="text" th:field="*{imageUrl}" class="form-control" required>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="/admin/products" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Update Product</button>
        </div>
      </form>

      <!-- 옵션 목록 -->
      <hr />
      <h5 class="mt-4">Options</h5>
      <div th:each="option : ${product.options}" class="border p-3 mb-2 rounded">
        <div class="row">
          <div class="col-md-5">
            <label>Option Name</label>
            <input type="text" th:value="${option.name}" class="form-control" disabled>
          </div>
          <div class="col-md-3">
            <label>Quantity</label>
            <input type="number" th:value="${option.quantity}" class="form-control" disabled>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <form th:action="@{'/admin/products/' + ${product.id} + '/options/' + ${option.id}}" method="post">
              <input type="hidden" name="_method" value="delete"/>
              <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
          </div>
        </div>
      </div>

      <!-- 옵션 추가 버튼 -->
      <button id="add-option-btn" class="btn btn-outline-primary mt-4" onclick="showOptionForm()">+ Add Option</button>

      <!-- 옵션 추가 폼 -->
      <div id="option-form-container" class="border rounded p-3 mt-3 d-none">
        <form th:action="@{'/admin/products/' + ${product.id} + '/options'}" method="post">
          <div class="mb-2">
            <label>Option Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-2">
            <label>Quantity</label>
            <input type="number" name="quantity" class="form-control" required>
          </div>
          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-success">Confirm</button>
            <button type="button" class="btn btn-secondary" onclick="cancelOptionForm()">Cancel</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<script>
  function showOptionForm() {
    document.getElementById('add-option-btn').classList.add('d-none');
    document.getElementById('option-form-container').classList.remove('d-none');
  }

  function cancelOptionForm() {
    document.getElementById('add-option-btn').classList.remove('d-none');
    document.getElementById('option-form-container').classList.add('d-none');
    document.querySelector('input[name="name"]').value = '';
    document.querySelector('input[name="quantity"]').value = '';
  }
</script>
</body>
</html>
